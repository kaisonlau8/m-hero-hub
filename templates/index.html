<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>猛士服务运营 · 控制台黄页</title>
  <style>
    :root {
      --blue: #3370ff;
      --orange: #ff8800;
      --red: #f5222d;
      --turquoise: #00b578;
      --purple: #7b61ff;
      --red-accent: #e34d59;
      --gray: #8f959e;
      --bg: #f5f5f5;
      --card-bg: #fff;
      --text: #1f2329;
      --border: #dee0e3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    .nav {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; gap: 16px;
    }
    .nav h1 { font-size: 18px; font-weight: 600; color: var(--orange); }
    .nav .sub { margin-left: auto; color: var(--gray); font-size: 13px; }
    .container { max-width: 960px; margin: 28px auto; padding: 0 16px; }
    .hero { margin-bottom: 20px; }
    .hero h2 { font-size: 22px; margin-bottom: 6px; }
    .hero p { color: var(--gray); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 18px 18px 16px; display: flex; flex-direction: column;
      min-height: 180px; transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: #c9cdd4; box-shadow: 0 4px 14px rgba(31,35,41,.06); }
    .card.accent-orange { border-left: 4px solid var(--orange); }
    .card.accent-blue { border-left: 4px solid var(--blue); }
    .card.accent-green { border-left: 4px solid var(--turquoise); }
    .card.accent-purple { border-left: 4px solid var(--purple); }
    .card.accent-red { border-left: 4px solid var(--red-accent); }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .card p { color: var(--gray); font-size: 13px; flex: 1; margin-bottom: 14px; }
    .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: var(--gray); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
    }
    .badge-green { background: #e8f8ee; color: var(--turquoise); }
    .badge-red { background: #fff1f0; color: #cf1322; }
    .btn {
      display: inline-block; text-align: center; text-decoration: none;
      padding: 8px 14px; border-radius: 4px; font-size: 14px; background: var(--blue); color: #fff;
    }
    .btn:hover { background: #2860e0; }
    .btn.offline { background: #a0a4ab; pointer-events: none; }
    footer { text-align: center; padding: 20px; color: var(--gray); font-size: 13px; }
    code { font-size: 12px; background: #f0f1f2; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <nav class="nav">
    <h1>猛士服务运营</h1>
    <span style="font-size:14px; color:var(--text);">控制台黄页</span>
    <span class="sub"><your-hostname></span>
  </nav>

  <div class="container">
    <div class="hero">
      <h2>功能控制台入口</h2>
      <p>汇总事故车、VIP 提醒、区域报表、门店审计、超时机器人统计等控制台。状态每 10 秒自动刷新。</p>
    </div>

    <div class="grid" id="grid">
      {% for s in services %}
      <div class="card accent-{{ s.accent }}" data-id="{{ s.id }}">
        <div class="meta">
          <span class="badge {{ 'badge-green' if s.online else 'badge-red' }}" data-role="badge">
            {{ '在线' if s.online else '离线' }}
          </span>
          <span>本地 :{{ s.port }}</span>
        </div>
        <h3>{{ s.name }}</h3>
        <p>{{ s.desc }}</p>
        <a class="btn {{ '' if s.online else 'offline' }}" href="{{ s.url }}" target="_blank" rel="noopener" data-role="open">
          打开控制台
        </a>
      </div>
      {% endfor %}
    </div>
  </div>

  <footer>猛士科技 服务运营 · 内部工具导航</footer>

  <script>
  async function refresh() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      (d.services || []).forEach((s) => {
        const card = document.querySelector(`.card[data-id="${s.id}"]`);
        if (!card) return;
        const badge = card.querySelector('[data-role="badge"]');
        const btn = card.querySelector('[data-role="open"]');
        badge.textContent = s.online ? '在线' : '离线';
        badge.className = 'badge ' + (s.online ? 'badge-green' : 'badge-red');
        btn.classList.toggle('offline', !s.online);
      });
    } catch (e) {}
  }
  setInterval(refresh, 10000);
  </script>
</body>
</html>
